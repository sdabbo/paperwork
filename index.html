<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Paperwork · Your documents, filed in Google Drive</title>
    <meta name="description" content="Scan, upload or forward documents; Paperwork names them, sums them up and files them in your Google Drive." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)" />
    <!--
      The splash screen: the app's icon draws itself while the app loads, on the app's own canvas color. Plain CSS
      and SVG, here so it shows with the page's first paint; src/lib/splash.ts takes it away once the first screen is
      there, and it leaves by itself after 8 s should the app never load (once the app runs, the app decides). No
      script: the server's policy allows none inline. Without animations (reduced motion, or none at all) it is the
      finished icon and name. Installed on Android it starts as Android's own launch screen (see below).
    -->
    <style>
      html{background:#f6f6f4}
      #splash{--sp-bg:#f6f6f4;--sp-ink:#1b1a18;--sp-glow:0 1px 2px rgba(9,64,54,.12),0 14px 32px -12px rgba(13,122,104,.5);position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:var(--sp-bg);color:var(--sp-ink);contain:strict;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;animation:sp-failsafe .4s ease 8s forwards}
      @media (prefers-color-scheme:dark){html{background:#111214}#splash{--sp-bg:#111214;--sp-ink:#ededeb;--sp-glow:0 0 0 .5px rgba(255,255,255,.06),0 16px 36px -14px rgba(79,209,181,.24)}}
      .sp-stage{display:flex;flex-direction:column;align-items:center;gap:22px;margin-bottom:2vh}
      .sp-mark{width:96px;height:96px;border-radius:24px;box-shadow:var(--sp-glow)}
      .sp-mark svg,.sp-word{display:block;overflow:visible}
      .sp-mark svg{width:100%;height:100%}
      .sp-word{width:136px;height:27px;fill:currentColor}
      .sp-ink{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .sp-fold{transform-box:view-box;transform-origin:20.35px 9.65px}
      .sp-scan{opacity:0}
      /* The app runs (src/lib/splash.ts): no safety net, and the beam (the lines' breathing without motion) goes on
         for as long as the app is loading; without it they stop with the safety net */
      #splash.sp-live{animation:none}
      .sp-live .sp-scan,.sp-live .sp-lines{animation-iteration-count:infinite}
      @media (min-width:768px) and (min-height:600px){.sp-mark{width:112px;height:112px;border-radius:28px}.sp-word{width:158px;height:31.4px}.sp-stage{gap:26px}}
      /* Leaving: taps reach the app at once. The icon and name go first, then the canvas fades into the app, so the
         two never show through each other. */
      #splash.sp-out{pointer-events:none;animation:sp-out .32s cubic-bezier(.4,0,.2,1) .16s forwards}
      .sp-out .sp-stage{animation:sp-out .16s ease forwards}
      /* The intro (about 1.1 s): the tile settles, a pen draws the page, the corner folds over, the lines write
         themselves, the name rises. Then, while loading takes longer, a scanner beam reads the page. */
      @media (prefers-reduced-motion:no-preference){
        .sp-mark{animation:sp-in .14s ease-out both,sp-grow .6s cubic-bezier(.16,1,.3,1) both}
        .sp-page{stroke-dasharray:59.2 99;animation:sp-page .48s cubic-bezier(.55,.08,.25,1) .14s both}
        .sp-fold{animation:sp-fold .34s cubic-bezier(.3,.1,.25,1.14) .52s both}
        .sp-l1{stroke-dasharray:7 30;animation:sp-l1 .26s cubic-bezier(.45,0,.2,1) .62s both}
        .sp-l2{stroke-dasharray:5 30;animation:sp-l2 .22s cubic-bezier(.45,0,.2,1) .72s both}
        .sp-word{animation:sp-rise .56s cubic-bezier(.16,1,.3,1) .54s both}
        .sp-scan{animation:sp-scan 2.4s cubic-bezier(.45,0,.55,1) 1.2s 3}
        .sp-out .sp-stage{animation:sp-leave .2s cubic-bezier(.4,0,.6,1) forwards}
      }
      /* Nothing moves: the finished icon from the first paint, its lines breathing while loading takes longer */
      @media (prefers-reduced-motion:reduce){
        .sp-scan{display:none}
        .sp-lines{animation:sp-breathe 2.4s ease-in-out 1s 3}
      }
      .sp-disc{display:none}
      /* Installed on Android, Chrome first shows Android's own launch screen: the maskable icon cut to a 240 px
         circle in the middle of the screen between the bars, on the manifest's background_color (in dark mode on a
         dark one, as phones show it: the splash's dark canvas), and fades it out over the page in 300 ms once the page has run its script (not with its first paint). So
         there the splash starts as that very frame, and once the fade is over the circle squares off and shrinks
         into the tile, then the name rises. src/lib/splash.ts knows when that is and moves it all there
         (LAUNCH_SCREEN_MS); the times here (from 1 s) are for a page whose script never runs. The icon is drawn
         already: no pen. Not on iPhone (its launch screen is the plain canvas), nor on a computer. html.sp-android
         does the same, for tests and dev tools. */
      @media (display-mode:standalone) and (pointer:coarse){@supports not (-webkit-touch-callout:none){html{--sp-android:1}}}
      html.sp-android{--sp-android:1}
      @container style(--sp-android:1){
        /* Where Android's icon is, from the middle of the screen between the bars: right there with 3-button
           navigation; with gesture navigation Chrome shows it about 4 px higher, which CSS can't tell */
        #splash{--sp-native-y:0px}
        /* Its frame: the icon at 288 px (the tile × 3, as in the maskable icon) in a 240 px circle, moved from the
           tile's place to the middle (by half the gap and name below the tile, and half the stage's 2vh lift) */
        .sp-mark{--sp-s0:3;--sp-dy:calc((22px + 27px) / 2 + 1vh + var(--sp-native-y));position:relative;box-shadow:none}
        @media (min-width:768px) and (min-height:600px){.sp-mark{--sp-s0:2.5714;--sp-dy:calc((26px + 31.4px) / 2 + 1vh + var(--sp-native-y))}}
        /* Its glow, which Android's frame doesn't have */
        .sp-mark::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;box-shadow:var(--sp-glow)}
        /* The beam (or the lines' breathing) after the intro as elsewhere, and done before the safety net */
        @media (prefers-reduced-motion:no-preference){
          .sp-mark,.sp-page,.sp-fold,.sp-l1,.sp-l2{animation:none}
          .sp-mark svg{animation:sp-handoff .46s cubic-bezier(.45,0,.2,1) 1s backwards}
          .sp-mark::after{animation:sp-in .3s ease 1.3s backwards}
          .sp-word{animation:sp-rise .5s cubic-bezier(.16,1,.3,1) 1.24s both}
          .sp-scan{animation:sp-scan 2.4s cubic-bezier(.45,0,.55,1) 1.84s 2}
        }
        /* Nothing moves: Android's frame fades away over the finished icon and name */
        @media (prefers-reduced-motion:reduce){
          .sp-disc{display:block;position:absolute;width:288px;height:288px;opacity:0;transform:translateY(var(--sp-native-y));animation:sp-native .3s ease 1s backwards}
          .sp-lines{animation:sp-breathe 2.4s ease-in-out 1.64s 2}
        }
      }
      @keyframes sp-handoff{from{transform:translateY(var(--sp-dy)) scale(var(--sp-s0));clip-path:inset(8.333% round 41.667%)}to{clip-path:inset(0 round 25%)}}
      @keyframes sp-native{from{opacity:1}}
      @keyframes sp-in{from{opacity:0}}
      @keyframes sp-grow{from{transform:scale(.9)}}
      @keyframes sp-page{from{stroke-dashoffset:59.4}}
      @keyframes sp-fold{from{transform:rotate(45deg) scaleY(0) rotate(-45deg)}to{transform:rotate(45deg) scaleY(1) rotate(-45deg)}}
      @keyframes sp-l1{from{stroke-dashoffset:7.1}}
      @keyframes sp-l2{from{stroke-dashoffset:5.1}}
      @keyframes sp-rise{from{opacity:0;transform:translateY(8px)}}
      @keyframes sp-scan{0%{opacity:0;transform:translateY(7px)}12%,56%{opacity:1}70%,100%{opacity:0;transform:translateY(26.5px)}}
      @keyframes sp-breathe{50%{opacity:.5}}
      @keyframes sp-leave{to{opacity:0;transform:scale(1.04)}}
      @keyframes sp-out{to{opacity:0}}
      @keyframes sp-failsafe{to{opacity:0;visibility:hidden}}
    </style>
